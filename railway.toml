# Railway service definition for pmbot.
#
# ONE service does both jobs: it serves the dashboard and runs the daily
# refresh on an internal timer. Set PMBOT_DAILY_AT (e.g. "16:00") to arm the
# daily pass; leave it unset for a dashboard only.
#
# Do NOT split the refresh into a second Railway service. A volume attaches to
# exactly one service, so the second one gets an empty journal and its work
# goes nowhere -- silently. See docs/DEPLOY.md.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "pmbot serve --host 0.0.0.0"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
# One instance. The journal is SQLite on a volume, and a volume attaches to a
# single instance -- scaling this past 1 would corrupt the thing it exists to
# protect.
numReplicas = 1
